name: Build FloatX APK (Android 16 ARM64)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug & ephemeral test release keystores
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ephemeral runner-only test signing keystore for ARM64 Release APK
          keytool -genkeypair -v -keystore my-upload-key.jks \
            -storepass "floatx-ci-test-pass" -alias upload -keypass "floatx-ci-test-pass" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FloatX Test,O=FloatX,C=US"

      - name: Build Debug & ARM64 Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: floatx-ci-test-pass
          KEY_PASSWORD: floatx-ci-test-pass
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload ARM64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-arm64-v8a-android16-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
