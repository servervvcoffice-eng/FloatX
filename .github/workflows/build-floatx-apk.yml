name: Build FloatX APK (Android 16 ARM64)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Prepare test release keystore
        shell: bash
        run: |
          rm -f my-upload-key.jks
          keytool -genkeypair -noprompt \
            -keystore my-upload-key.jks \
            -storepass "floatx-ci-test-pass" \
            -alias upload \
            -keypass "floatx-ci-test-pass" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FloatX Test,O=FloatX,C=US"

      - name: Build ARM64 Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: floatx-ci-test-pass
          KEY_PASSWORD: floatx-ci-test-pass
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload ARM64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-arm64-v8a-android16-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
